[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptrans"
dynamic = ["version"]
description = "Translate editable PowerPoint text with glossary-aware LLMs and verifiable OOXML preservation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
    {name = "Hehan Zhao", email = "80203549+Z-MarkUs@users.noreply.github.com"},
]
keywords = [
    "powerpoint",
    "pptx",
    "translation",
    "localization",
    "llm",
    "document-automation",
    "translation-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=6.1.3,<7",
    "Pillow>=12.3.0,<13",
    "platformdirs>=4.11.7,<5",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2.3,<2",
    "PyYAML>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "typer>=0.27.2,<1",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.3.0,<2",
]
openai = [
    "openai>=3.7.0,<4",
]
review = [
    "PyMuPDF>=1.28.2,<2",
]
dev = [
    "anthropic>=1.3.0,<2",
    "bandit>=1.9.4,<2",
    "build>=1.6.0,<2",
    "hypothesis>=6.167.1,<7",
    "lxml-stubs>=0.5.1,<1",
    "markdown-it-py>=4.2,<5",
    "mypy>=2.3.1,<3",
    "openai>=3.7.0,<4",
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "python-pptx>=1.0.2,<2",
    "pypdf>=6.16.2,<7",
    "reportlab==5.0.1",
    "ruff>=0.16.5,<1",
    "twine>=7.0.0,<8",
    "types-PyYAML>=6.0.12.20260815,<7",
]

[project.scripts]
pptrans = "pptrans.cli:main"

[project.urls]
Homepage = "https://github.com/Z-MarkUs/PPTrans"
Documentation = "https://github.com/Z-MarkUs/PPTrans#readme"
Issues = "https://github.com/Z-MarkUs/PPTrans/issues"
Source = "https://github.com/Z-MarkUs/PPTrans"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pptrans.__version__"}

[tool.setuptools.package-data]
pptrans = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--disable-socket",
    "--cov=pptrans",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["pptrans"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["work", "dist", "build"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = [
    "PLR0913",
    "S101",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = ["PLR0911", "T201"]
"scripts/build_curated_demo.py" = ["RUF001"]
"src/pptrans/cli.py" = ["FBT002", "PLR0917"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["pptrans"]

[[tool.mypy.overrides]]
module = ["pptx.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
