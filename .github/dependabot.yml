version: 2
updates:
  - package-ecosystem: pip
    # Preserve supported minimums when existing ranges allow newer releases.
    versioning-strategy: increase-if-necessary
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
