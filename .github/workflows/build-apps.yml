name: Build Apps

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app (arm64)
        run: python3 build_app.py macos arm64
      
      - name: Upload macOS app (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: PPTrans-macos-arm64
          path: dist/PPTrans.app
          retention-days: 30
          if-no-files-found: error

  build-macos-x86_64:
    runs-on: macos-14
    continue-on-error: true  # Allow this to fail gracefully since GitHub Actions doesn't support Intel Macs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Install x86_64 dependencies (for Rosetta 2)
        run: |
          # Install x86_64 versions of native dependencies using Rosetta 2
          arch -x86_64 python3 -m pip install --upgrade pip
          arch -x86_64 python3 -m pip install --force-reinstall --no-deps Pillow || true
          # Note: This may not work if x86_64 wheels aren't available
      
      - name: Build macOS app (x86_64)
        run: |
          # Try to build using Rosetta 2
          arch -x86_64 python3 build_app.py macos x86_64 || python3 build_app.py macos x86_64
        continue-on-error: true
      
      - name: Upload macOS app (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: PPTrans-macos-x86_64
          path: dist/PPTrans.app
          retention-days: 30
          if-no-files-found: ignore  # Don't fail if file doesn't exist

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build Windows executable
        run: python build_app.py windows
      
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PPTrans-windows
          path: dist/PPTrans.exe
          retention-days: 30
          if-no-files-found: error

