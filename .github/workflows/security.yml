name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive_path}" -C "${install_dir}" gitleaks
          chmod 0755 "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Prove the pinned scanner detects its control fixture
        shell: bash
        run: |
          set -euo pipefail
          report_path="${RUNNER_TEMP}/gitleaks-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f -- "${report_path}"' EXIT
          set +e
          printf 'token = "ghp_%s%s"\n' \
            'aB3dE5fG7hJ9kL1m' 'N3pQ5rS7tU9vW1xY3zA5' | \
            gitleaks --no-banner --redact --report-format json \
              --report-path "${report_path}" stdin
          scan_status=$?
          set -e
          if [[ "${scan_status}" -ne 1 ]] || ! grep -q '"RuleID": "github-pat"' "${report_path}"; then
            echo "Gitleaks failed its synthetic github-pat detection control." >&2
            exit 1
          fi
      - name: Scan all Git history with Gitleaks
        run: gitleaks git --redact --no-banner --verbose --log-opts="--all" .
