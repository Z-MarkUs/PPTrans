name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "⚠️  PYPI secret not set. Skipping PyPI upload."
            echo "Set PYPI secret in repository settings to enable PyPI publishing."
          else
            echo "📤 Uploading to PyPI..."
            twine upload dist/*
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/*.whl dist/*.tar.gz
          retention-days: 30

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app (arm64)
        run: python3 build_app.py macos arm64
      
      - name: Upload macOS app (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: PPT-Translator-macos-arm64
          path: dist/PPT-Translator.app
          retention-days: 30

  build-macos-x86_64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app (x86_64)
        run: python3 build_app.py macos x86_64
      
      - name: Upload macOS app (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: PPT-Translator-macos-x86_64
          path: dist/PPT-Translator.app
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build Windows executable
        run: python build_app.py windows
      
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PPT-Translator-windows
          path: dist/PPT-Translator.exe
          retention-days: 30

