repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: agent-skills
        name: Validate mirrored agent skills
        entry: python scripts/validate_agent_skills.py
        language: system
        pass_filenames: false
